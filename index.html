<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Visuals</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* VOICE: plain index of study diagrams
   IDEA: a datasheet catalogue page
   PICTURE: the list itself, grouped by course
   COLOUR and TYPE: cobalt strip, white rows; Space Grotesk + Inter
   LAYOUT: title strip, one column of course sections */
:root{color-scheme:light;--bg:#ffffff;--ink:#0d1222;--muted:#5a6278;--line:#c9d2ec;--zone:#eef2ff;--strip:#1240e0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0a0d18;--ink:#e6e9f5;--muted:#9aa3bd;--line:#2a3456;--zone:#141a30}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a0d18;--ink:#e6e9f5;--muted:#9aa3bd;--line:#2a3456;--zone:#141a30}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif}
header{background:var(--strip);color:#fff;padding:22px max(5vw,16px)}
h1{font:600 clamp(26px,4vw,38px)/1.1 "Space Grotesk",Inter,sans-serif;margin:0}
header p{margin:6px 0 0;opacity:.85}
main{max-width:860px;margin:0 auto;padding:20px max(4vw,16px) 48px}
h2{font:600 20px/1.3 "Space Grotesk",Inter,sans-serif;margin:24px 0 10px}
ul{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
li+li{border-top:1px solid var(--line)}
a{display:block;padding:12px 16px;color:inherit;text-decoration:none}
a:hover,a:focus-visible{background:var(--zone);outline:none}
a b{font-weight:500}
a span{display:block;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<header>
<h1>Study Visuals</h1>
<p>Interactive diagrams for course notes.</p>
</header>
<main id="list"></main>
<script>
{
const courses=[
 {name:"CST108 Programming Practice",notes:[
  {href:"cst108/insert-at-end.html",title:"Linked list: insertAtEnd",sub:"Topic 3-2 · temp walks to the last node, then links the new node"}
 ]}
];
document.getElementById('list').innerHTML=courses.map(c=>`<h2>${c.name}</h2><ul>${c.notes.map(n=>`<li><a href="${n.href}"><b>${n.title}</b><span>${n.sub}</span></a></li>`).join('')}</ul>`).join('');
}
</script>
</body>
</html>
